{% extends 'student/common.html' %}

{% block content %}
<div class="container mt-5">
  <h2 class="text-center mb-4">Apply for {{ job.name }} at {{ job.company_name }}</h2>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="card p-4 shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-center mb-4">Application Form</h5>

            <div class="form-group">
              <label><strong>Student Name:</strong></label>
              <input type="text" class="form-control" value="{{ student.name }}" disabled>
            </div>

            <div class="form-group">
              <label><strong>Email:</strong></label>
              <input type="email" class="form-control" value="{{ student.email }}" disabled>
            </div>

            <div class="form-group">
              <label><strong>Phone:</strong></label>
              <input type="text" class="form-control" value="{{ student.phone }}" disabled>
            </div>

            <div class="form-group">
              <label for="qualification"><strong>Highest Qualification:</strong></label>
              <input type="text" class="form-control" name="qualification" required>
            </div>

            <div class="form-group">
              <label for="marks"><strong>Marks:</strong></label>
              <input type="text" class="form-control" name="marks" required>
            </div>

            <div class="form-group">
              <label for="resume"><strong>Upload Resume:</strong></label>
              <input type="file" class="form-control" name="resume" required>
            </div>

            <div class="form-group text-center mt-4">
              <button type="submit" class="btn btn-success">Submit Application</button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

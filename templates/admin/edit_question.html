{% extends 'admin/common.html' %}

{% block content %}
<main class="main" style="padding: 30px; min-height: 100vh;">
    <h2 style="text-align:center; margin-bottom: 30px;">Edit Question</h2>

    <form method="POST" style="width: 50%; margin: auto; background-color: #f9f9f9; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        {% csrf_token %}

        <label style="font-weight: bold;">Question:</label>
        <input type="text" name="question" value="{{ question.question }}" required style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px;">

        <label style="font-weight: bold;">Option 1:</label>
        <input type="text" name="option1" value="{{ question.option1 }}" required style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px;">

        <label style="font-weight: bold;">Option 2:</label>
        <input type="text" name="option2" value="{{ question.option2 }}" required style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px;">

        <label style="font-weight: bold;">Option 3:</label>
        <input type="text" name="option3" value="{{ question.option3 }}" required style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px;">

        <label style="font-weight: bold;">Option 4:</label>
        <input type="text" name="option4" value="{{ question.option4 }}" required style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px;">

        <label style="font-weight: bold;">Answer:</label>
        <input type="text" name="answer" value="{{ question.answer }}" required style="width: 100%; padding: 10px; margin-bottom: 30px; border: 1px solid #ccc; border-radius: 5px;">

        <div style="text-align: center;">
            <button type="submit" style="padding: 10px 20px; background-color: dodgerblue; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Update Question
            </button>
        </div>
    </form>
</main>
{% endblock %}

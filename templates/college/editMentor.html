{% extends 'college/common.html' %}
{% load static %}
{% block content %}

<div class="container mt-4">
  <h2>Edit Mentor</h2>
  <form method="POST" action="">
    {% csrf_token %}
    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" value="{{ mentor.name }}" required class="form-control">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="text" name="email" value="{{ mentor.email }}" required class="form-control">
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="text" name="phone" value="{{ mentor.phone }}" required class="form-control">
    </div>
    <div class="form-group">
      <label>Location</label>
      <input type="text" name="location" value="{{ mentor.location }}" required class="form-control">
    </div>
    <div class="form-group">
      <label>Qualification</label>
      <input type="text" name="qualification" value="{{ mentor.qualification }}" required class="form-control">
    </div>
    <button type="submit" class="btn btn-success">Update</button>
    <a href="{% url 'viewMentors' %}" class="btn btn-secondary">Back</a>
  </form>
</div>

{% endblock %}
